version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: dev_redis_ts
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "securepassword123"]
    volumes:
      - redis_data_ts:/data
    ports:
      - "6380:6379"
    networks:
      - dev_network_ts

networks:
  dev_network_ts:
    driver: bridge

volumes:
  redis_data_ts:
    driver: local
